name: setup
description: Sets up development environment
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.1
    - uses: actions/setup-node@v7.1.0
      with:
        cache: pnpm
        node-version-file: package.json
    - run: pnpm i --frozen-lockfile
      shell: bash
